name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o OxideLauncher.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: gradle assembleDebug
        working-directory: OxideLauncher

      - uses: actions/upload-artifact@v4
        with:
          name: OxideLauncher-apk
          path: OxideLauncher/app/build/outputs/apk/debug/app-debug.apk
